<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Yt Clone</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>  
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
       <nav class="navbar navbar-light bg-light fixed-top shadow-sm">
        <div class="container-fluid">
            <div class="d-flex w-100 align-items-center">
                <div class="d-flex align-items-center gap-3">   
                    <!-- gap-means margin-->
                     <button class="navbar-toggler" 
                    data-bs-target="#sidebar"
                    data-bs-toggle="offcanvas"
                    aria-controls="sidebar">
                    <span class="navbar-toggler-icon"></span>
                </button>
                    <img src="images/youtube-logo.svg" alt="Youtube Logo" class="nav-icon" height="24">
                </div>
                <div class="flex-grow-1 d-flex justify-content-center mx-4">
                    <div class="input-group" style="max-width: 600px;">
                        <input class="form-control">
                        <button class="btn btn-outline-secondary rounded-pill">
                            <img src="images/Search.png" alt="Search" class="nav-icon" height="24">
                        </button>
                    </div>
                 </div> 
                <div class="d-flex align-items-center gap-3">
                    <button class="btn btn-light">+</button>
                <img src="images/images.png" alt="bell" class="nav-icon" height="24">                
            </div>
            </div>
        </div>
       </nav>
    </header>
    <div class="container-fluid">
        <div class="row">

            <aside class=" offcanvas offcanvas-start" id="sidebar">

                <div class="offcanvas-header d-flex align-items-center gap-3">
                    <button class="navbar-toggler" 
                    data-bs-dismiss="offcanvas"
                    aria-controls="sidebar">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <img src="images/youtube-logo.svg" alt="Youtube Logo" class="nav-icon" height="24">
                
                </div>       
                
              
                <div class="offcanvas-body overflow-auto">
                    <div class="d-flex flex-column gap-3 p-2">
                        <a class="d-flex align-items-center gap-3 p-2 text-decoration-none text-dark">
                            <img src="images/home-icon.png" height="20">
                            <span>Home</span>
                        </a>
                        <a class="d-flex align-items-center gap-3 p-2 text-decoration-none text-dark">
                            <img src="images/youtube-shorts.jpg"  height="20">
                            <span>Shorts</span>
                        </a>
                        <a class="d-flex align-items-center gap-3 p-2 text-decoration-none text-dark">
                            <img src="images/subs.png" height="20">
                            <span>Subscriptions</span>
                        </a>
                       <hr class="my-2">
                       <h6 class="px-2 mt-3 text-muted">You</h6>
                        <a class="d-flex align-items-center gap-3 p-2 text-decoration-none text-dark">
                            <img src="images/history.png" height="20">
                            <span>History</span>
                        </a>
                        <a class="d-flex align-items-center gap-3 p-2 text-decoration-none text-dark">
                            <img src="images/playlists.png" height="20">
                            <span>Playlists</span>
                        </a>
                        <a class="d-flex align-items-center gap-3 p-2 text-decoration-none text-dark">
                            <img src="images/watchlater.png" height="20">
                            <span>Watch Later</span>
                        </a>
                        <a class="d-flex align-items-center gap-3 p-2 text-decoration-none text-dark">
                            <img src="images/Liked.jpg" height="20">
                            <span>Liked Videos</span>
                        </a>
                        <a class="d-flex align-items-center gap-3 p-2 text-decoration-none text-dark">
                            <img src="images/downloads-1.webp.jpg" height="20">
                            <span>Downloads</span>
                        </a>
                        <hr class="my-2">
                        <h6 class="px-2 mt-3 text-muted">Explore</h6>
                        <a class="d-flex align-items-center gap-3 p-2 text-decoration-none text-dark">
                            <img src="images/shopping-cart.jpg" height="20">
                            <span>Shopping</span>
                        </a>
                        <a class="d-flex align-items-center gap-3 p-2 text-decoration-none text-dark">
                            <img src="images/youtube-music.webp" height="20">
                            <span>Music</span>
                        </a>

                        <a class="d-flex align-items-center gap-3 p-2 text-decoration-none text-dark">
                            <img src="images/movies.png" height="20">
                            <span>Movies</span>
                        </a>
                        <a class="d-flex align-items-center gap-3 p-2 text-decoration-none text-dark">
                            <img src="images/downloads-1.webp.jpg" height="20">
                            <span>Downloads</span>
                        </a>
                        
                        <hr>
                    </div>
                </div>
              
              </aside>
<div class="col-auto vh-100 d-flex flex-column align-items-center">
    <div class="d-flex flex-column align-items-center py-5 gap-2">
    
      <div class="d-flex flex-column align-items-center">  
        <img src="images/home-icon.png" height="22" width="22">
        <span class="small text-center">Home</span>
      </div>
      <div class="d-flex flex-column align-items-center">
        <img src="images/youtube-shorts.jpg" height="22" width="22">
        <span class="small text-center">Shorts</span>
      </div>
      <div class="d-flex flex-column align-items-center">
        <img src="images/subs.png" height="22" width="22">
        <span class="small text-center">Subscriptions</span>
      </div>
      <div class="d-flex flex-column align-items-center">
        <img src="images/profile.png" height="22" width="22">
        <span class="small text-center">You</span>
      </div>
    </div>
</div>
        <main class="col-12 col-md-9 col-lg-10 px-3">
                <!-- Categories-->
                <div class="d-flex overflow-x-auto py-2 px-3 gap-2">
              
                  <button class="btn btn-light rounded-pill text-nowrap">All</button>
                  <button class="btn btn-light rounded-pill text-nowrap">Music</button>
                  <button class="btn btn-light rounded-pill text-nowrap">Gaming</button>
                  <button class="btn btn-light rounded-pill text-nowrap">News</button>
                  <button class="btn btn-light rounded-pill text-nowrap">Live</button>
                  <button class="btn btn-light rounded-pill text-nowrap">Podcasts</button>
                  <button class="btn btn-light rounded-pill text-nowrap">AI</button>
                  <button class="btn btn-light rounded-pill text-nowrap">Programming</button>
                  <button class="btn btn-light rounded-pill text-nowrap">Startups</button>
                  <button class="btn btn-light rounded-pill text-nowrap">Stocks</button>
                  <button class="btn btn-light rounded-pill text-nowrap">Movie Musicals</button>
                  <button class="btn btn-light rounded-pill text-nowrap">Operating Systems</button>
                  <button class="btn btn-light rounded-pill text-nowrap">CSS</button>
                  <button class="btn btn-light rounded-pill text-nowrap">C++</button>
                  <button class="btn btn-light rounded-pill text-nowrap">Mixes</button>
                  <button class="btn btn-light rounded-pill text-nowrap">Desktops</button>

                </div>
            <div class="row">
                <div class="col-12 col-sm-6 col-md-4 ">
                    Video grid-1
                </div>
                <div class="col-12 col-sm-6 col-md-4 ">
                    Video grid-2
                </div>
                <div class="col-12 col-sm-6 col-md-4 ">
                    Video grid-3
                </div>
                <div class="col-12 col-sm-6 col-md-4 ">
                    Video grid-4
                </div>
                <div class="col-12 col-sm-6 col-md-4 ">
                    Video grid-5
                </div>
                <div class="col-12 col-sm-6 col-md-4 ">
                    Video grid-6
                </div>
            </div>
        </main>
    </div>
    </div>
</body>
</html>
