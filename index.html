<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yt Clone</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <header>
       <nav class="navbar bg-white fixed-top shadow-sm">
        <div class="container-fluid">
            <div class="d-flex w-100 align-items-center">
                <div class="d-flex align-items-center gap-3">   
                    <!-- gap-means margin-->
                    <img src="images/hamburger-menu.svg" alt="Hamburger Menu" class="nav-icon" height="24">
                    <img src="images/youtube-logo.svg" alt="Youtube Logo" class="nav-icon" height="24">
                </div>
                <div class="flex-grow-1 d-flex justify-content-center mx-4">
                    <div class="input-group" style="max-width: 600px;">
                        <input class="form-control">
                        <button class="btn btn-outline-secondary rounded-pill-end">
                            <img src="images/Search.png" alt="Search" class="nav-icon" height="24">
                        </button>
                    </div>
                 </div> 
                <div class="d-flex align-items-center gap-3">
                    <button class="btn btn-light">+</button>
                <img src="images/images.png" alt="bell" class="nav-icon" height="24">                
            </div>
            </div>
        </div>
       </nav>
    </header>
    <div class="container-fluid">
        <div class="row">
        <aside class="col-12 col-md-3 col-lg-2 bg-light">
            this is a sidebar 
        </aside>
        <main class="col-12 col-md-9 col-lg-10">
            <div class="row">
                <div class="col-12 col-sm-6 col-md-4 ">
                    Video grid-1
                </div>
                <div class="col-12 col-sm-6 col-md-4 ">
                    Video grid-2
                </div>
                <div class="col-12 col-sm-6 col-md-4 ">
                    Video grid-3
                </div>
                <div class="col-12 col-sm-6 col-md-4 ">
                    Video grid-4
                </div>
                <div class="col-12 col-sm-6 col-md-4 ">
                    Video grid-5
                </div>
                <div class="col-12 col-sm-6 col-md-4 ">
                    Video grid-6
                </div>
            </div>
        </main>
    </div>
    </div>
</body>
</html>
