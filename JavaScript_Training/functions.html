<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Functions</h1>
    <input id="price" type="number" placeholder="Enter the price">
    <input id="quantity" type="number" placeholder="Enter the quantity">
    <button id="calculateButton" onclick="handleClick()">Calculate Total</button>
    <p id="total"></p>
    <input id="numa" type="number" placeholder="Enter the first number">
    <input id="numb" type="number" placeholder="Enter the second number">
    <button id="processButton" onclick="processNumbers()">Process Numbers</button>
    <p id="result"></p>
    <div> 
        <input id="itemlist" type="number" placeholder="Enter the items to calulate tip">
        <button id="addItemButton" onclick="addItem()">Add Item</button>
        <button id="calculateTipButton" onclick="calculateTip()">Calculate Tip</button>
        <p id="itemsbreakdownDetails"></p>
        <p id="tip"></p>
    </div>
    <script src="functions.js"></script>
</body>
</html>
